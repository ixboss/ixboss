<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160" role="img" aria-label="BOSS — Just some nerd student who loves to play with everything he sees.">
  <defs>
    <!-- Bulletproof shine: <animate> on x1/x2 coords (objectBoundingBox), supported by every SMIL renderer -->
    <linearGradient id="shine" x1="-0.4" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FF3B30"/>
      <stop offset="0.55" stop-color="#FF3B30"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-0.4;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.4" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="card"><rect x="0.6" y="0.6" width="758.8" height="158.8" rx="14"/></clipPath>
  </defs>

  <rect x="0.6" y="0.6" width="758.8" height="158.8" rx="14" fill="#0B0E13" stroke="#1E2430" stroke-width="1.2"/>

  <g clip-path="url(#card)">
    <!-- ambient particles: barely-there upward drift -->
    <g opacity="0.5">
      <circle cx="150" cy="140" r="1.4" fill="#FF3B30" opacity="0.14">
        <animate attributeName="cy" values="150;20" dur="24s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.14;0" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="30" r="1.1" fill="#FFFFFF" opacity="0.12">
        <animate attributeName="cy" values="170;20" dur="30s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.12;0" dur="30s" repeatCount="indefinite"/>
      </circle>
      <circle cx="590" cy="120" r="1.6" fill="#FF3B30" opacity="0.12">
        <animate attributeName="cy" values="160;25" dur="27s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.12;0" dur="27s" begin="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="60" r="1.1" fill="#FFFFFF" opacity="0.10">
        <animate attributeName="cy" values="165;15" dur="34s" begin="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.10;0" dur="34s" begin="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- entrance: fade + rise, once -->
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.8s" fill="freeze"/>
      <text x="40" y="84" fill="url(#shine)" text-rendering="geometricPrecision" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">BOSS</text>
      <rect x="42" y="98" width="76" height="3" rx="1.5" fill="#FF3B30"/>
      <text x="40" y="130" fill="#AEBACB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400">Just some nerd student who loves to play with everything he sees.</text>
    </g>
  </g>
</svg>
