<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 198" width="760" height="198" role="img" aria-label="BOSS (@ixboss) — Just some nerd who loves to play with everything he sees.">
  <defs>
    <linearGradient id="specularLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284C7" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#0284C7" stop-opacity="0.55"/>
      <stop offset="0.38" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="0.54" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.78" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bossWordClipLight">
      <text x="40" y="95" text-rendering="geometricPrecision" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, 'Segoe UI', Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-2">BOSS</text>
    </clipPath>
    <linearGradient id="underlinePulseLight" x1="0" y1="0" x2="1" y2="0">
