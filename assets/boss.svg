<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 184" width="760" height="184" role="img" aria-label="BOSS (@ixboss) — Just some nerd student who loves to play with everything he sees.">
  <defs>
    <linearGradient id="shineDark" x1="-0.4" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.45" stop-color="#00E5FF"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F8FAFC"/>
      <animate attributeName="x1" values="-0.4;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.4" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="horizonDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="auraDark" cx="76%" cy="22%" r="48%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="heroClipDark"><rect x="0.6" y="0.6" width="758.8" height="182.8" rx="14"/></clipPath>
  </defs>

  <rect x="0.6" y="0.6" width="758.8" height="182.8" rx="14" fill="#05070B" stroke="#18273A" stroke-width="1.2"/>

  <g clip-path="url(#heroClipDark)">
    <rect x="0" y="0" width="760" height="184" fill="url(#auraDark)"/>
    <!-- subtle telemetry grid -->
    <g stroke="#38BDF8" stroke-opacity="0.05" stroke-width="1">
      <line x1="190" y1="0" x2="190" y2="184"/>
      <line x1="380" y1="0" x2="380" y2="184"/>
      <line x1="570" y1="0" x2="570" y2="184"/>
      <line x1="0" y1="61" x2="760" y2="61"/>
      <line x1="0" y1="122" x2="760" y2="122"/>
    </g>

    <!-- Singularity horizon arc -->
    <path d="M 120 0 Q 380 42 640 0" fill="none" stroke="url(#horizonDark)" stroke-width="1.4"/>

    <!-- drifting Six Eyes particles -->
    <g>
      <circle cx="150" cy="145" r="1.4" fill="#00E5FF" opacity="0.18">
        <animate attributeName="cy" values="170;18" dur="22s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.24;0" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="34" r="1.2" fill="#8B5CF6" opacity="0.16">
        <animate attributeName="cy" values="178;22" dur="28s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.20;0" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="130" r="1.6" fill="#00E5FF" opacity="0.16">
        <animate attributeName="cy" values="175;20" dur="25s" begin="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.22;0" dur="25s" begin="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="695" cy="70" r="1.1" fill="#38BDF8" opacity="0.14">
        <animate attributeName="cy" values="172;16" dur="32s" begin="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.18;0" dur="32s" begin="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Stylized Six Eyes radar emblem on right -->
    <g transform="translate(658, 92)" opacity="0.88">
      <circle cx="0" cy="0" r="40" fill="none" stroke="#18273A" stroke-width="1"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#00E5FF" stroke-opacity="0.7" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="6" fill="#00E5FF" opacity="0.9">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Identity block -->
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 5; 0 0" dur="0.7s" fill="freeze"/>
      <circle cx="44" cy="36" r="3" fill="#00E5FF">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="56" y="39.5" fill="#38BDF8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4">[ SYSTEM ONLINE // CAIRO, EGYPT · @IXBOSS ]</text>

      <text x="40" y="98" fill="url(#shineDark)" text-rendering="geometricPrecision" font-family="'Space Grotesk', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">BOSS</text>
      <rect x="42" y="112" width="84" height="3" rx="1.5" fill="#00E5FF"/>
      <rect x="132" y="112" width="28" height="3" rx="1.5" fill="#8B5CF6"/>

      <text x="40" y="142" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="500">Full-Stack &amp; Systems Engineer · Hossam</text>
      <text x="40" y="163" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400">Just some nerd student who loves to play with everything he sees.</text>
    </g>
  </g>
</svg>
