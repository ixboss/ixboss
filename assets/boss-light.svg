    </radialGradient>
    <clipPath id="heroClipLight"><rect x="0.6" y="0.6" width="758.8" height="196.8" rx="14"/></clipPath>
  </defs>

  <rect x="0.6" y="0.6" width="758.8" height="196.8" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

  <g clip-path="url(#heroClipLight)">
    <rect x="0" y="0" width="760" height="198" fill="url(#auraLight)"/>
    <g stroke="#0284C7" stroke-opacity="0.055" stroke-width="1">
      <line x1="190" y1="0" x2="190" y2="198"/>
      <line x1="380" y1="0" x2="380" y2="198"/>
      <line x1="570" y1="0" x2="570" y2="198"/>
      <line x1="0" y1="66" x2="760" y2="66"/>
      <line x1="0" y1="132" x2="760" y2="132"/>
    </g>

    <path d="M 120 0 Q 380 42 640 0" fill="none" stroke="url(#horizonLight)" stroke-width="1.4"/>

    <g transform="translate(658, 76)" opacity="0.9">
      <line x1="-44" y1="0" x2="44" y2="0" stroke="#CBD5E1" stroke-opacity="0.55" stroke-width="0.9"/>
      <line x1="0" y1="-44" x2="0" y2="44" stroke="#CBD5E1" stroke-opacity="0.55" stroke-width="0.9"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#0284C7" stroke-opacity="0.38" stroke-width="1" stroke-dasharray="4 4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#0284C7" stroke-opacity="0.72" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="4.5" fill="#0284C7" opacity="0.92">
        <animate attributeName="opacity" values="0.65;1;0.65" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g>
      <circle cx="44" cy="34" r="3" fill="#0284C7">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="56" y="37.5" fill="#0284C7" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4">[ SYSTEM ONLINE // CAIRO, EGYPT · @IXBOSS ]</text>

      <text x="40" y="95" text-rendering="geometricPrecision" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, 'Segoe UI', Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-2" fill="#0F172A">BOSS</text>
      <g clip-path="url(#bossWordClipLight)" aria-hidden="true">
        <rect x="-40" y="36" width="68" height="70" fill="url(#specularLight)" transform="skewX(-22)">
          <animate attributeName="x" values="-40;-40;280;280" keyTimes="0;0.04;0.48;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1" dur="3.2s" repeatCount="indefinite"/>
