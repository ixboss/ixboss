<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 112" width="760" height="112" role="img" aria-label="02 asus-control-macos — Fan, Thermal &amp; Power Control for macOS on ASUS Laptops">
  <defs>
