<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 20" width="760" height="20" role="presentation">
  <defs>
    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E11D48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF7849" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="10" x2="760" y2="10" stroke="#D0D7DE" stroke-width="1"/>
  <rect x="-180" y="9" width="180" height="2" rx="1" fill="url(#pulseLine)">
    <animate attributeName="x" values="-180;760" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
