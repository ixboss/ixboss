      <circle cx="0" cy="0" r="38" fill="none" stroke="#18273A" stroke-width="1"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#38BDF8" stroke-opacity="0.38" stroke-width="1" stroke-dasharray="4 4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
