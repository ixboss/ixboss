<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 104" width="760" height="104" role="img" aria-label="asus-control-macos — macOS hardware control for ASUS ROG and TUF laptops">
  <defs>
    <clipPath id="c"><rect x="0.5" y="0.5" width="759" height="103" rx="14"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5252" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF5252"/>
      <stop offset="1" stop-color="#FF5252" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="103" rx="14" fill="#0B0E13" stroke="#1E2430" stroke-width="1"/>
  <g clip-path="url(#c)">
    <!-- traveling accent along the top hairline -->
    <rect x="-120" y="0.75" width="120" height="1.5" fill="url(#g)">
      <animate attributeName="x" values="-120;760" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="48" fill="#F2F6FB" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="-0.3">asus-control-macos</text>
    <rect x="41" y="56" width="44" height="2.5" rx="1.25" fill="#FF5252">
      <animate attributeName="width" values="44;68;44" dur="7s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="82" fill="#AEBACB" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400">macOS hardware control for ASUS ROG &amp; TUF laptops</text>
    <rect x="622" y="38" width="98" height="26" rx="7" fill="#12161F" stroke="#232B39" stroke-width="1"/>
    <circle cx="637" cy="51" r="3" fill="#FF5252"/>
    <text x="648" y="55.5" fill="#C9D3E0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500">Swift</text>
  </g>
</svg>
