      <text x="40" y="152" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400">Just some nerd who loves to play with everything he sees.</text>

      <rect x="40" y="164" width="212" height="22" rx="6" fill="#0B0F17" stroke="#18273A" stroke-width="1"/>
      <circle cx="52" cy="175" r="2.8" fill="#00E5FF"/>
      <text x="62" y="178.5" fill="#F8FAFC" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600">ixboss.vercel.app ↗</text>

      <rect x="262" y="164" width="248" height="22" rx="6" fill="#0B0F17" stroke="#18273A" stroke-width="1"/>
      <circle cx="274" cy="175" r="2.8" fill="#8B5CF6"/>
      <text x="284" y="178.5" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="500">4 Public Repos · ★ 6 Stars</text>
