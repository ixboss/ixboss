<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160" role="img" aria-label="BOSS — Just some nerd student who loves to play with everything he sees.">
  <defs>
    <linearGradient id="bossWave" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.42" stop-color="#FF5252"/>
      <stop offset="0.58" stop-color="#FF7849"/>
      <stop offset="1" stop-color="#F8FAFC"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0; 560 0; -300 0" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Card base: quiet graphite, hairline border -->
  <rect x="0.6" y="0.6" width="758.8" height="158.8" rx="14" fill="#0B0E13" stroke="#1E2430" stroke-width="1.2"/>

  <!-- Name -->
  <text x="40" y="84" fill="url(#bossWave)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">BOSS</text>

  <!-- Accent underline -->
  <rect x="42" y="98" width="76" height="3" rx="1.5" fill="#FF5252"/>

  <!-- Tagline -->
  <text x="40" y="130" fill="#AEBACB" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Just some nerd student who loves to play with everything he sees.</text>
</svg>
