<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160" role="img" aria-label="BOSS — Just some nerd student who loves to play with everything he sees.">
  <defs>
    <linearGradient id="bossWaveLight" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.42" stop-color="#E11D48"/>
      <stop offset="0.58" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#0F172A"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0; 560 0; -300 0" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="cardL"><rect x="0.6" y="0.6" width="758.8" height="158.8" rx="14"/></clipPath>
  </defs>

  <rect x="0.6" y="0.6" width="758.8" height="158.8" rx="14" fill="#FFFFFF" stroke="#E5E9F0" stroke-width="1.2"/>

  <g clip-path="url(#cardL)">
    <!-- ambient particles: barely-there upward drift -->
    <g opacity="0.5">
      <circle cx="150" cy="140" r="1.4" fill="#E11D48" opacity="0.12">
        <animate attributeName="cy" values="150;20" dur="24s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.12;0" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="30" r="1.1" fill="#0F172A" opacity="0.10">
        <animate attributeName="cy" values="170;20" dur="30s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.10;0" dur="30s" repeatCount="indefinite"/>
      </circle>
      <circle cx="590" cy="120" r="1.6" fill="#EA580C" opacity="0.11">
        <animate attributeName="cy" values="160;25" dur="27s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.11;0" dur="27s" begin="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="60" r="1.1" fill="#0F172A" opacity="0.08">
        <animate attributeName="cy" values="165;15" dur="34s" begin="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.08;0" dur="34s" begin="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- entrance: fade + rise, once -->
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.8s" fill="freeze"/>
      <text x="40" y="84" fill="url(#bossWaveLight)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">BOSS</text>
      <rect x="42" y="98" width="76" height="3" rx="1.5" fill="#E11D48"/>
      <text x="40" y="130" fill="#5B6B7F" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Just some nerd student who loves to play with everything he sees.</text>
    </g>
  </g>
</svg>
