<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 188" width="760" height="188" role="img" aria-label="02 — universal-harness: Portable cross-platform runtime for DeepSeek Harness over LAN">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="758" height="186" rx="14" fill="url(#cardBg2)" stroke="#D0D7DE" stroke-width="1.2"/>
  <rect x="1" y="24" width="3.5" height="140" rx="1.75" fill="#0284C7"/>

  <!-- Left Content Area -->
  <g transform="translate(26, 28)">
    <text x="0" y="0" fill="#0284C7" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.2">02 // PORTABLE CROSS-PLATFORM RUNTIME &amp; LAN PROTOCOL</text>

    <text x="0" y="28" fill="#0F172A" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="800" letter-spacing="-0.4">universal-harness</text>

    <text x="0" y="52" fill="#334155" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400">Run DeepSeek Harness from a USB drive, desktop, or Android phone over local LAN.</text>

    <g transform="translate(0, 72)" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" fill="#475569">
      <circle cx="5" cy="-4" r="2.2" fill="#0284C7"/>
      <text x="15" y="0">Self-contained exFAT-safe portable directory with bundled runtime &amp; sessions</text>

      <circle cx="5" cy="16" r="2.2" fill="#FF7849"/>
      <text x="15" y="20">Node-authoritative execution with automatic event replay on controller reconnect</text>

      <circle cx="5" cy="36" r="2.2" fill="#059669"/>
      <text x="15" y="40">Zero-cloud LAN pairing via mDNS, QR bootstrap, pinned TLS &amp; Ed25519 auth</text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 126)" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10" font-weight="600" fill="#334155">
      <rect x="0" y="0" width="60" height="22" rx="5" fill="#0F172A" stroke="#334155"/>
      <text x="30" y="14.5" text-anchor="middle">Kotlin</text>

      <rect x="68" y="0" width="66" height="22" rx="5" fill="#0F172A" stroke="#334155"/>
      <text x="101" y="14.5" text-anchor="middle">Node.js</text>

      <rect x="142" y="0" width="42" height="22" rx="5" fill="#0F172A" stroke="#334155"/>
      <text x="163" y="14.5" text-anchor="middle">C</text>

      <rect x="192" y="0" width="96" height="22" rx="5" fill="#0F172A" stroke="#334155"/>
      <text x="240" y="14.5" text-anchor="middle">Ed25519 TLS</text>

      <rect x="296" y="0" width="124" height="22" rx="5" fill="#0F172A" stroke="#334155"/>
      <text x="358" y="14.5" text-anchor="middle" fill="#0284C7">mDNS · JSON-RPC</text>
    </g>
  </g>

  <!-- Right Micro-Visual: LAN Node-to-Node Encrypted Mesh -->
  <g transform="translate(534, 22)">
    <rect x="0" y="0" width="204" height="144" rx="10" fill="#0F172A" stroke="#D0D7DE" stroke-width="1"/>
    <text x="12" y="19" fill="#475569" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9.5" font-weight="700">LAN MESH // NO CLOUD</text>
    <text x="192" y="19" text-anchor="end" fill="#0284C7" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" font-weight="700">TLS 1.3</text>

    <!-- Link Paths -->
    <path id="lanLink1" d="M 48 64 L 156 64" stroke="#334155" stroke-width="2"/>
    <path d="M 48 64 L 102 106 L 156 64" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Animated Encrypted Packet Dots -->
    <circle r="3" fill="#0284C7">
      <animateMotion path="M 48 64 L 156 64" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.6" fill="#059669">
      <animateMotion path="M 156 64 L 48 64" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>

    <!-- Left Node: Desktop / USB -->
    <rect x="16" y="44" width="60" height="40" rx="7" fill="#0F172A" stroke="#0284C7" stroke-width="1.2"/>
    <text x="46" y="61" text-anchor="middle" fill="#0F172A" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9.5" font-weight="700">USB/PC</text>
    <text x="46" y="74" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8">HOST</text>

    <!-- Right Node: Android Node -->
    <rect x="128" y="44" width="60" height="40" rx="7" fill="#0F172A" stroke="#059669" stroke-width="1.2"/>
    <text x="158" y="61" text-anchor="middle" fill="#0F172A" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9.5" font-weight="700">ANDROID</text>
    <text x="158" y="74" text-anchor="middle" fill="#059669" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8">NODE</text>

    <!-- Bottom Pill: Replay Buffer -->
    <rect x="52" y="94" width="100" height="22" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="102" y="108" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8.5">EVENT REPLAY</text>

    <text x="14" y="133" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8.5">AUTH: Ed25519</text>
    <text x="190" y="133" text-anchor="end" fill="#059669" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8.5">SYNC: ACTIVE</text>
  </g>
</svg>
