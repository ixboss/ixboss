    <text x="36" y="30" fill="#0284C7" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="600" letter-spacing="1.2">02 // MACOS THERMAL &amp; POWER CONTROL SUITE</text>
    <text x="36" y="57" fill="#0F172A" font-family="'Space Grotesk', Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3">asus-control-macos</text>
    <rect x="36" y="66" width="44" height="2.5" rx="1.25" fill="#0284C7">
      <animate attributeName="width" values="44;72;44" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="36" y="92" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="400">Fan, Thermal &amp; Power Control for macOS on ASUS Laptops</text>
    <rect x="528" y="42" width="196" height="28" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="544" cy="56" r="3.2" fill="#0284C7"/>
    <text x="556" y="60" fill="#0F172A" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="500">★ 5 · Swift</text>
