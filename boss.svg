<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="BOSS">
  <title>BOSS</title>
  <defs>
    <style>
      .name {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 120px;
        letter-spacing: -3px;
        fill: #f0f6fc;
      }
      .caret { fill: #ff5c5c; }
    </style>
    <clipPath id="reveal">
      <rect x="0" y="0" height="180" width="0">
        <animate attributeName="width"
                 values="0;0;340;340;340;0;0"
                 keyTimes="0;0.10;0.45;0.86;0.92;0.99;1"
                 dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="880" height="180" rx="12" fill="#0d1117"/>

  <g clip-path="url(#reveal)">
    <text class="name" x="0" y="130" textLength="340" lengthAdjust="spacing">BOSS</text>
  </g>

  <rect class="caret" x="0" y="26" width="9" height="120">
    <animate attributeName="x"
             values="0;0;340;340;349;0;0"
             keyTimes="0;0.10;0.45;0.86;0.92;0.99;1"
             dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
