      <rect x="132" y="106" width="28" height="3" rx="1.5" fill="#7C3AED" fill-opacity="0.65"/>
      <g clip-path="url(#underlineClipLight)" aria-hidden="true">
        <rect x="-24" y="105" width="54" height="5" fill="url(#underlinePulseLight)">
          <animate attributeName="x" values="-24;-24;176;176" keyTimes="0;0.04;0.48;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1" dur="3.2s" repeatCount="indefinite"/>
        </rect>
      </g>

      <text x="40" y="132" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600">Full-Stack &amp; Systems Engineer · Hossam</text>
      <text x="40" y="152" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400">Just some nerd who loves to play with everything he sees.</text>

      <rect x="40" y="164" width="212" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="52" cy="175" r="2.8" fill="#0284C7"/>
      <text x="62" y="178.5" fill="#0F172A" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600">ixboss.vercel.app ↗</text>

      <rect x="262" y="164" width="248" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="274" cy="175" r="2.8" fill="#7C3AED"/>
      <text x="284" y="178.5" fill="#475569" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="500">4 Public Repos · ★ 6 Stars</text>
    </g>
