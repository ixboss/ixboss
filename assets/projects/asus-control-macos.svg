<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 188" width="760" height="188" role="img" aria-label="01 — asus-control-macos: Native macOS control suite and IOKit ACPI/EC bridge for ASUS ROG and TUF laptops">
  <defs>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11151D"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <linearGradient id="fanArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF5252" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="758" height="186" rx="14" fill="url(#cardBg1)" stroke="#1E2532" stroke-width="1.2"/>
  <rect x="1" y="24" width="3.5" height="140" rx="1.75" fill="#FF5252"/>

  <!-- Left Content Area -->
  <g transform="translate(26, 28)">
    <!-- Index + Domain Header -->
    <text x="0" y="0" fill="#FF5C5C" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.2">01 // MACOS KERNEL EXTENSION &amp; HARDWARE DAEMON</text>

    <!-- Project Title -->
    <text x="0" y="28" fill="#F8FAFC" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="800" letter-spacing="-0.4">asus-control-macos</text>

    <!-- Concise Engineer Summary -->
    <text x="0" y="52" fill="#CBD5E1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400">Native macOS alternative to Armoury Crate &amp; G-Helper for ASUS ROG and TUF laptops.</text>

    <!-- Technical Bullet Points -->
    <g transform="translate(0, 72)" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" fill="#94A3B8">
      <circle cx="5" cy="-4" r="2.2" fill="#FF5252"/>
      <text x="15" y="0">Direct <tspan fill="#E2E8F0">ATKD.WMNB</tspan> ACPI &amp; <tspan fill="#E2E8F0">EC0</tspan> register programming via IOKit kernel bridge</text>

      <circle cx="5" cy="16" r="2.2" fill="#FF7849"/>
      <text x="15" y="20">8-point custom fan curves (<tspan fill="#E2E8F0">EC0.SFTC/SFTG</tspan>), PL1/PL2 wattage &amp; charge limits</text>

      <circle cx="5" cy="36" r="2.2" fill="#10B981"/>
      <text x="15" y="40">Menu Bar SwiftUI app + <tspan fill="#E2E8F0">asusctl</tspan> CLI + <tspan fill="#E2E8F0">asusctld</tspan> sleep/wake daemon</text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 126)" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10" font-weight="600" fill="#CBD5E1">
      <rect x="0" y="0" width="64" height="22" rx="5" fill="#151B26" stroke="#283142"/>
      <text x="32" y="14.5" text-anchor="middle">SwiftUI</text>

      <rect x="72" y="0" width="82" height="22" rx="5" fill="#151B26" stroke="#283142"/>
      <text x="113" y="14.5" text-anchor="middle">IOKit Kext</text>

      <rect x="162" y="0" width="52" height="22" rx="5" fill="#151B26" stroke="#283142"/>
      <text x="188" y="14.5" text-anchor="middle">C++</text>

      <rect x="222" y="0" width="84" height="22" rx="5" fill="#151B26" stroke="#283142"/>
      <text x="264" y="14.5" text-anchor="middle">ACPI / EC0</text>

      <rect x="314" y="0" width="128" height="22" rx="5" fill="#151B26" stroke="#283142"/>
      <text x="378" y="14.5" text-anchor="middle" fill="#10B981">FX707ZM Verified</text>
    </g>
  </g>

  <!-- Right Micro-Visual: Live 8-Point EC Fan Curve Telemetry Graph -->
  <g transform="translate(534, 22)">
    <rect x="0" y="0" width="204" height="144" rx="10" fill="#0B0E14" stroke="#1E2634" stroke-width="1"/>
    <text x="12" y="19" fill="#94A3B8" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9.5" font-weight="700">EC0.SFTC // 8-PT CURVE</text>
    <text x="192" y="19" text-anchor="end" fill="#FF5C5C" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" font-weight="700">TURBO</text>

    <!-- Grid Lines -->
    <g stroke="#181F2C" stroke-width="1">
      <line x1="14" y1="36" x2="190" y2="36"/>
      <line x1="14" y1="62" x2="190" y2="62"/>
      <line x1="14" y1="88" x2="190" y2="88"/>
      <line x1="14" y1="114" x2="190" y2="114"/>
    </g>

    <!-- Area Under 8-Point Curve -->
    <path d="M 16 112 L 40 108 L 65 100 L 90 88 L 115 72 L 140 54 L 165 40 L 188 32 L 188 118 L 16 118 Z" fill="url(#fanArea)"/>

    <!-- 8-Point Fan Curve Line -->
    <path d="M 16 112 L 40 108 L 65 100 L 90 88 L 115 72 L 140 54 L 165 40 L 188 32" fill="none" stroke="#FF5252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 8 Curve Nodes -->
    <g fill="#0B0E14" stroke="#FF5C5C" stroke-width="1.8">
      <circle cx="16" cy="112" r="2.8"/>
      <circle cx="40" cy="108" r="2.8"/>
      <circle cx="65" cy="100" r="2.8"/>
      <circle cx="90" cy="88" r="2.8"/>
      <circle cx="115" cy="72" r="2.8"/>
      <circle cx="140" cy="54" r="3.2" fill="#FF5252">
        <animate attributeName="r" values="2.8;4.5;2.8" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="165" cy="40" r="2.8"/>
      <circle cx="188" cy="32" r="2.8"/>
    </g>

    <!-- Bottom Telemetry Readout -->
    <text x="14" y="133" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8.5">PL1: 45W · PL2: 90W</text>
    <text x="190" y="133" text-anchor="end" fill="#10B981" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8.5">BAT CAP: 80%</text>
  </g>
</svg>
