    <text x="30" y="61" fill="#0F172A" font-family="'Space Grotesk', Inter, Arial, sans-serif" font-size="15.5" font-weight="700">Sadaqa Jaria v2 &amp; Cross-Platform Systems Tooling</text>

    <rect x="572" y="28" width="160" height="32" rx="8" fill="#F8FAFC" stroke="#0284C7" stroke-opacity="0.45" stroke-width="1"/>
